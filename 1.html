<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恭喜你！</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Microsoft YaHei', sans-serif;
  overflow: hidden;
  cursor: default;
}

.container {
  text-align: center;
  position: relative;
  animation: glitch 3s infinite;
}

.main-text {
  font-size: clamp(60px, 12vw, 160px);
  font-weight: 900;
  color: #ff0080;
  text-shadow:
    0 0 20px #ff0080,
    0 0 40px #ff0080,
    0 0 80px #ff0080,
    0 0 160px #ff0080;
  letter-spacing: 8px;
  animation: pulse 1.5s ease-in-out infinite, rainbow 4s linear infinite;
  user-select: none;
  white-space: nowrap;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.9; }
}

@keyframes rainbow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

@keyframes glitch {
  2%, 64% { transform: translate(0); }
  4% { transform: translate(-5px, 3px); }
  6% { transform: translate(5px, -3px); }
  8% { transform: translate(-3px, -5px); }
  10% { transform: translate(3px, 5px); }
  12% { transform: translate(-5px, -3px); }
}

.particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: #ff0080;
  border-radius: 50%;
  animation: float linear infinite;
  opacity: 0;
}

@keyframes float {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

.flash-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(circle, transparent 30%, rgba(255,0,128,0.15) 100%);
  animation: flashPulse 2s ease-in-out infinite;
}

@keyframes flashPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

.reveal {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.reveal.active {
  display: flex;
}

.step-1 { display: flex; flex-direction: column; align-items: center; gap: 20px; }

.surprise {
  font-size: clamp(48px, 10vw, 140px);
  font-weight: 900;
  color: #ff0080;
  text-shadow:
    0 0 20px #ff0080,
    0 0 40px #ff0080,
    0 0 80px #ff0080;
  animation: pulse 0.3s ease-in-out infinite, rainbow 2s linear infinite;
}

.you-gay {
  font-size: clamp(30px, 5vw, 60px);
  color: #fff;
  margin-top: 20px;
  text-shadow: 0 0 20px rgba(255,255,255,0.8);
  animation: rainbow 3s linear infinite;
}

.camera-feed {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 200px;
  height: 150px;
  border: 3px solid #ff0080;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(255,0,128,0.5);
  display: none;
  z-index: 100;
  transform: scaleX(-1);
}

.camera-feed video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-label {
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  color: #ff0080;
  font-size: 12px;
  font-weight: bold;
  text-shadow: 0 0 10px #000;
  background: rgba(0,0,0,0.7);
  padding: 2px 10px;
  border-radius: 4px;
  pointer-events: none;
  white-space: nowrap;
}

@media (max-width: 600px) {
  .main-text { font-size: 48px; }
  .camera-feed { width: 120px; height: 90px; }
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div class="flash-overlay"></div>

<div class="container">
  <div class="step-1" id="step1">
    <div class="main-text" id="mainText">看到的是Gay</div>
  </div>

  <div class="reveal" id="reveal">
    <div class="surprise">🎉 恭喜 🎉</div>
    <div class="you-gay" id="youGayText">你确实是 Gay！</div>
  </div>
</div>

<div class="camera-feed" id="cameraFeed">
  <video id="video" autoplay playsinline></video>
  <div class="camera-label">📷 监控中</div>
</div>

<script>
const colors = ['#ff0080', '#ff00ff', '#8a2be2', '#00ffff', '#ff1493'];
for (let i = 0; i < 60; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.background = colors[Math.floor(Math.random() * colors.length)];
  p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
  p.style.animationDuration = (5 + Math.random() * 10) + 's';
  p.style.animationDelay = (Math.random() * 10) + 's';
  document.getElementById('particles').appendChild(p);
}

const step1 = document.getElementById('step1');
const reveal = document.getElementById('reveal');

setTimeout(() => {
  step1.style.display = 'none';
  reveal.classList.add('active');
  launchConfetti();
  try {
    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      document.getElementById('cameraFeed').style.display = 'block';
      document.getElementById('video').srcObject = stream;
    }).catch(() => {});
  } catch(e) {}
}, 500);

function launchConfetti() {
  const emojis = ['🎉', '🎊', '🌈', '💖', '✨', '🦄', '🏳️‍🌈', '💕'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.cssText = `
        position: fixed; font-size: ${20 + Math.random() * 30}px;
        left: ${Math.random() * 100}vw;
        top: -50px;
        pointer-events: none;
        z-index: 999;
        animation: confettiFall ${2 + Math.random() * 3}s ease-in forwards;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }, i * 80);
  }
}

const styleSheet = document.createElement('style');
styleSheet.textContent = `
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}`;
document.head.appendChild(styleSheet);

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))) {
    e.preventDefault();
  }
});
</script>
</body>
</html>
